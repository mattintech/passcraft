name: CI & Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Unit & E2E Testing with Linter Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Test Suite
        run: npm test

      - name: Run End-to-End (E2E) Browser Tests
        run: npm run test:e2e

      - name: Test Extension Packaging
        run: npm run build:zip

      - name: Verify Package Contents
        run: |
          unzip -l passcraft-extension.zip
          test -f manifest.json
          test -f popup/popup.html
          test -f popup/popup.js
          test -f popup/wordlist.js
          test -f popup/qrcode.js
          test -f icons/icon-128.png

      - name: Validate with Mozilla Addons Linter
        run: npx addons-linter passcraft-extension.zip
