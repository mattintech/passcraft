<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 440px;
      height: 280px;
      background: radial-gradient(circle at 70% 30%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
                  radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 60%),
                  #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      gap: 16px;
      text-align: center;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      max-width: 320px;
      line-height: 1.4;
      margin: 0;
    }

    .pill-group {
      display: flex;
      gap: 8px;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 3px 10px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="logo-badge">
    <img src="../icons/icon-48.png" alt="PassCraft" width="40" height="40">
  </div>
  <h1 class="title">PassCraft</h1>
  <p class="subtitle">Private, Offline Password & Diceware Passphrase Generator</p>
  <div class="pill-group">
    <span class="pill">100% Offline</span>
    <span class="pill">Zero Telemetry</span>
    <span class="pill">No Login</span>
  </div>
</body>
</html>
